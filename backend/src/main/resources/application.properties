spring.application.name=trafficfines
debug=true
debug=true

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/trafficfines_db
spring.datasource.username=postgres
spring.datasource.password=pasan

# Hibernate — creates tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Execute data.sql after Hibernate creates tables
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
app.jwtSecret=TrafficFinesSystemSecretKey12345678901234567890
app.jwtExpirationMs=86400000

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# Twilio SMS Configuration
sms.twilio.account-sid=YOUR_TWILIO_ACCOUNT_SID
sms.twilio.auth-token=YOUR_TWILIO_AUTH_TOKEN
sms.twilio.from-number=+1234567890
sms.twilio.enabled=true

# Resilience4j Circuit Breaker — SMS (ADR-005)
# Prevents cascading failures when the SMS provider is unavailable.
# After 50% of the last 10 requests fail or are slow (>5s), the circuit opens
# for 30s before allowing 3 probe calls in half-open state to test recovery.
# CircuitBreaker is configured programmatically in SmsCircuitBreakerConfig.
# Tune these values via SmsCircuitBreakerConfig after load-testing.
