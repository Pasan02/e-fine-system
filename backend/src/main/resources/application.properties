spring.application.name=trafficfines

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/trafficfines_db
spring.datasource.username=postgres
spring.datasource.password=pasan

# Hibernate — only validates schema; Flyway owns all DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway — Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Configuration
app.jwtSecret=TrafficFinesSystemSecretKey12345678901234567890
app.jwtExpirationMs=86400000
